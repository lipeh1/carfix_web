# 持续集成：Next.js 单应用（web/）一键端到端验证
# 流程：内嵌 PostgreSQL 起库 → prisma migrate → 生产构建 → 起服务 → 结算流程回归
# 与本地 `npm test` 完全同一条链路，服务器端部署由 Vercel Git 集成负责
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e:
    name: 构建与结算回归
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      # Node 版本与 Vercel 生产环境保持一致（项目 nodeVersion=24.x）
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint（0 error 门禁，架构豁免项为 warning）
        run: npm run lint

      - name: 一键端到端（PG → 迁移 → 构建 → 服务 → 回归）
        run: node scripts/e2e.mjs

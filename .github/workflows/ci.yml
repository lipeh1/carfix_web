# 持续集成：Next.js 单应用（web/）一键端到端验证
# 流程：内嵌 PostgreSQL 起库 → prisma migrate → 生产构建 → 起服务 → 结算流程回归
# 基础回归后构建 PostgreSQL 生产镜像；仅开启部署变量后才会发布到轻量服务器
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: 构建与结算回归
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      # Node 版本与轻量服务器镜像保持一致
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint（0 error 门禁，架构豁免项为 warning）
        run: npm run lint

      - name: 一键端到端（PG → 迁移 → 构建 → 服务 → 回归）
        run: node scripts/e2e.mjs

  container:
    name: 构建并打包生产镜像
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 构建轻量服务器镜像
        run: docker build --pull -f web/Dockerfile.lighthouse -t "carweb:$GITHUB_SHA" web
      - name: 准备数据库与 HTTPS 镜像
        run: |
          docker pull postgres:18-bookworm
          docker pull caddy:2-alpine
      - name: 打包镜像和部署脚本
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          mkdir -p bundle
          cp deploy/lighthouse/{compose.yaml,Caddyfile,deploy.sh,backup.sh,init.sh,.env.example} bundle/
          docker save "carweb:$GITHUB_SHA" postgres:18-bookworm caddy:2-alpine | gzip -1 > bundle/images.tar.gz
          tar -cf release.tar -C bundle .
          sha256sum release.tar > release.tar.sha256
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          name: lighthouse-${{ github.sha }}
          path: |
            release.tar
            release.tar.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: 发布到轻量应用服务器
    needs: [e2e, container]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      vars.LIGHTHOUSE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 首次需要上传全部镜像，为跨地域链路预留传输时间
    timeout-minutes: 60
    environment: production
    concurrency:
      group: lighthouse-production
      cancel-in-progress: false
    steps:
      - name: 跳过已被新提交取代的发布
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head_sha="$(gh api "repos/$DEPLOY_REPOSITORY/commits/$DEPLOY_BRANCH" --jq .sha)"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '默认分支已有新提交，跳过这次旧版本发布。'
          fi
      - uses: actions/download-artifact@v8
        if: steps.fresh.outputs.current == 'true'
        with:
          name: lighthouse-${{ github.sha }}
      - name: 校验发布包并通过 SSH 部署
        if: steps.fresh.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.LIGHTHOUSE_HOST }}
          DEPLOY_USER: ${{ vars.LIGHTHOUSE_USER }}
          DEPLOY_PORT: ${{ vars.LIGHTHOUSE_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.LIGHTHOUSE_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          sha256sum -c release.tar.sha256
          echo "发布包大小：$(du -h release.tar | cut -f1)"
          umask 077
          key_dir="$RUNNER_TEMP/carweb-ssh"
          install -d -m 700 "$key_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          trap 'rm -f -- "$key_dir/key" "$key_dir/known_hosts" "$key_dir/config"' EXIT
          # SSH 与 rsync 共用连接配置，持续保留严格主机校验
          cat > "$key_dir/config" <<EOF
          Host lighthouse
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile "$key_dir/key"
            UserKnownHostsFile "$key_dir/known_hosts"
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          if ! command -v rsync >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y rsync
          fi
          remote_dir="/opt/carweb/releases/$RELEASE_SHA"
          echo '检查 SSH 连接、运行配置和上传工具'
          ssh -F "$key_dir/config" lighthouse "bash -s -- '$remote_dir'" <<'REMOTE'
          set -Eeuo pipefail
          test -f /opt/carweb/.env || { echo '请先初始化 /opt/carweb/.env' >&2; exit 1; }
          docker info >/dev/null
          docker compose version
          if ! command -v rsync >/dev/null; then
            echo '服务器缺少 rsync，正在安装'
            sudo -n apt-get update
            sudo -n apt-get install -y rsync
          fi
          mkdir -p -- "$1"
          REMOTE
          # 部分文件留在该版本目录；网络中断后重试可复用已传数据，完成后再校验整包
          uploaded=false
          for attempt in 1 2 3; do
            echo "上传发布包，第 $attempt/3 次尝试"
            if rsync -rt --checksum --partial-dir=.rsync-partial --timeout=120 \
              --info=progress2 --human-readable --outbuf=L \
              --rsh="ssh -F '$key_dir/config'" \
              release.tar release.tar.sha256 "lighthouse:$remote_dir/"; then
              uploaded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo '传输中断，10 秒后从已上传的数据继续'
              sleep 10
            fi
          done
          [[ "$uploaded" == true ]] || { echo '发布包上传失败，尚未执行应用更新' >&2; exit 1; }
          echo '发布包已传完，开始服务器校验、镜像导入和应用探活'
          ssh -F "$key_dir/config" lighthouse "set -e; cd '$remote_dir'; sha256sum -c release.tar.sha256; tar -xf release.tar; bash deploy.sh /opt/carweb; rm -f release.tar release.tar.sha256"
